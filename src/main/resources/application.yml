spring:
  application:
    name: coupon-interface

  datasource:
    url: jdbc:mysql://localhost:3306/coupon?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: coupon
    password: coupon
#    hikari:
#      maximum-pool-size: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false #OSIV 설정. 키면 view단까지 영속성 컨텍스트 유지