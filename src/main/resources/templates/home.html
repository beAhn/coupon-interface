<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠폰 발급 버전 목록</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: #111827;
        }
        .card { width: 360px; padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        h1 { margin: 0 0 24px; font-size: 24px; text-align: center; }
        a.item { display: block; padding: 16px; margin-bottom: 8px; background: #f9fafb; border-radius: 12px; color: inherit; text-decoration: none; }
        a.item:hover { background: #eef2ff; }
        .item b { color: #6366f1; margin-right: 8px; }
        .item span { font-size: 14px; color: #374151; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎟️ 선착순 쿠폰 발급</h1>
    <a class="item" th:each="issuer : ${issuers}" th:href="@{/{v}(v=${issuer.version()})}">
        <b th:text="${issuer.version()}">v1</b><span th:text="${issuer.description()}">설명</span>
    </a>
</div>
</body>
</html>
