<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠폰 발급 버전 목록</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: #111827;
        }
        main { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .card { width: 100%; max-width: 560px; padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        h1 { margin: 0 0 8px; font-size: 24px; text-align: center; }
        .guide { margin: 0 0 24px; font-size: 14px; color: #6b7280; text-align: center; }
        /* 큰 버전 1줄 + 하위 버전 칩 → 버전이 늘어도 세로 길이는 큰 버전 수만큼 */
        .row { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid #f3f4f6; }
        .row .major { min-width: 32px; font-weight: 700; color: #6366f1; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { padding: 6px 10px; background: #f9fafb; border-radius: 8px; font-size: 13px; color: #374151; text-decoration: none; }
        .chip:hover, .chip:focus-visible { background: #eef2ff; color: #4338ca; }
        .chip:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
        .chip b { margin-right: 6px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/gnb :: gnb}"></div>
<main>
<div class="card">
    <h1>🎟️ 선착순 쿠폰 발급</h1>
    <p class="guide">위 메뉴나 아래 목록에서 버전을 선택하세요</p>
    <div class="row" th:each="group : ${gnbGroups}">
        <span class="major" th:text="${group.key}">v7</span>
        <div class="chips">
            <a class="chip" th:each="issuer : ${group.value}" th:href="@{/{v}(v=${issuer.version()})}">
                <b th:text="${issuer.version()}">v7-1</b><span th:text="${issuer.description()}">설명</span>
            </a>
        </div>
    </div>
</div>
</main>
</body>
</html>
