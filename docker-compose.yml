# 로컬 실험용 인프라 (v4~)
services:
  mysql:
    image: mysql:8.0
    container_name: coupon-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # v6: 분산 락 저장소 (락은 휘발성이라 볼륨 없음)
  redis:
    image: redis:7.4
    container_name: coupon-redis
    ports:
      - "6379:6379"   # 로컬(IDE) 실행 앱도 접근
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # v8: 발급 메시지 브로커 (KRaft 단일 노드, ZooKeeper 없음)
  kafka:
    image: apache/kafka:4.2.1   # kafka-clients 버전(Spring Boot 4.1.1)에 맞춤
    container_name: coupon-kafka
    ports:
      - "9094:9094"   # 로컬(IDE) 실행 앱용 EXTERNAL 리스너
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = 컨테이너끼리(kafka:9092), EXTERNAL = 호스트에서(localhost:9094)
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 브로커 1대라 내부 토픽 복제 수 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 직접 생성 (파티션 수를 명시적으로)
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # 다중 서버 테스트: 앱 서버 2대 (같은 이미지, SERVER_NAME만 다름)
  app1:
    build: .
    image: coupon-app
    container_name: coupon-app1
    ports:
      - "8081:8080"   # 디버깅용 직접 접근
    environment:
      SERVER_NAME: app1
      COUPON_LB_URL: http://nginx   # 분산 대량 발급 시뮬레이터가 부를 주소
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  app2:
    image: coupon-app
    container_name: coupon-app2
    ports:
      - "8082:8080"
    environment:
      SERVER_NAME: app2
      COUPON_LB_URL: http://nginx   # 분산 대량 발급 시뮬레이터가 부를 주소
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app1:
        condition: service_started   # app1이 이미지를 빌드한 뒤 시작

  # 다중 서버 테스트: L4 로드밸런서
  nginx:
    image: nginx:1.27
    container_name: coupon-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  # 다중 서버 테스트: 부하 발생기 (같은 네트워크에서 nginx 호출, Mac 포트 포워딩 우회)
  # 실행: docker compose run --rm -e VERSION=v5-1 k6 run /scripts/issue.js
  k6:
    image: grafana/k6
    profiles: ["test"]   # up 할 때는 안 뜨고 run으로만 실행
    volumes:
      - ./k6:/scripts    # 스크립트, 보고서 공유
    environment:
      BASE_URL: http://nginx
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_PERIOD: 1s
    depends_on:
      - nginx

volumes:
  mysql-data:
