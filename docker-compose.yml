# 로컬 실험용 인프라 (v4~)
services:
  mysql:
    image: mysql:8.0
    container_name: coupon-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 다중 서버 테스트: 앱 서버 2대 (같은 이미지, SERVER_NAME만 다름)
  app1:
    build: .
    image: coupon-app
    container_name: coupon-app1
    ports:
      - "8081:8080"   # 디버깅용 직접 접근
    environment:
      SERVER_NAME: app1
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy

  app2:
    image: coupon-app
    container_name: coupon-app2
    ports:
      - "8082:8080"
    environment:
      SERVER_NAME: app2
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      app1:
        condition: service_started   # app1이 이미지를 빌드한 뒤 시작

  # 다중 서버 테스트: L4 로드밸런서
  nginx:
    image: nginx:1.27
    container_name: coupon-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  # 다중 서버 테스트: 부하 발생기 (같은 네트워크에서 nginx 호출, Mac 포트 포워딩 우회)
  # 실행: docker compose run --rm -e VERSION=v5-1 k6 run /scripts/issue.js
  k6:
    image: grafana/k6
    profiles: ["test"]   # up 할 때는 안 뜨고 run으로만 실행
    volumes:
      - ./k6:/scripts    # 스크립트, 보고서 공유
    environment:
      BASE_URL: http://nginx
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_PERIOD: 1s
    depends_on:
      - nginx

volumes:
  mysql-data:
