# v6: L4 로드밸런서 (TCP 연결 단위 분산)
worker_processes auto;

events {
    worker_connections 4096;
}

stream {
    # 연결마다 어느 앱으로 보냈는지 기록 (요청 단위가 아니라 연결 단위)
    log_format l4 '$remote_addr:$remote_port -> $upstream_addr '
                  'status=$status sent=$bytes_sent recv=$bytes_received time=$session_time';
    access_log /dev/stdout l4;

    upstream coupon_app {
        # 기본: 라운드로빈 (연결 단위)
        # zone: 워커 프로세스끼리 라운드로빈 순번 공유 (없으면 워커마다 app1부터 시작)
        zone coupon_app 64k;
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;
        proxy_pass coupon_app;
    }
}
